<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Studio Video - Render Hàng Loạt</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #0a0c10;
            --panel-bg: rgba(22, 27, 34, 0.85);
            --panel-border: rgba(255, 255, 255, 0.1);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            /* Cố định viewport không cuộn ngoài */
        }

        body {
            background: var(--bg-main);
            background-image:
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: stretch;
            padding: 12px 16px;
        }

        .container {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            padding: 20px 24px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            width: 1240px;
            max-width: 100%;
            height: calc(100vh - 24px);
            border: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-height: 768px) {
            body {
                padding: 8px 12px;
            }

            .container {
                padding: 14px 18px;
                height: calc(100vh - 16px);
            }

            .header-nav {
                margin-bottom: 8px;
                padding-bottom: 8px;
            }

            #setupSection {
                padding: 8px 12px;
                margin-bottom: 8px;
            }

            .queue-summary-card {
                padding: 6px 12px;
                margin-bottom: 8px;
            }

            td {
                padding: 8px 12px;
            }
        }

        /* Header Navigation & Top Controls */
        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 12px;
            gap: 12px;
        }

        .header-title h2 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
            text-decoration: none;
            white-space: nowrap;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.35);
        }

        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--panel-border);
            color: #cbd5e1;
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .btn-outline {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
            box-shadow: none;
        }

        .btn-outline:hover {
            background: rgba(16, 185, 129, 0.25);
            color: #6ee7b7;
        }

        /* Setup Section - Horizontal Compact Grid & Collapsible State */
        #setupSection {
            flex-shrink: 0;
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 12px;
            align-items: flex-end;
            margin-bottom: 12px;
            background: rgba(15, 23, 42, 0.4);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--panel-border);
            transition: all 0.25s ease;
        }

        #setupSection.collapsed {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 14px;
            margin-bottom: 8px;
            min-height: 34px;
            background: rgba(15, 23, 42, 0.6);
        }

        #setupSummaryBar {
            display: none;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        #setupSection.collapsed #setupSummaryBar {
            display: flex;
        }

        #setupSection.collapsed .setup-expanded-content {
            display: none !important;
        }

        .setup-expanded-content {
            display: contents;
        }

        /* Locked Row Controls for Finished Videos */
        .row-locked .preview-image {
            cursor: default !important;
            opacity: 0.85;
            pointer-events: none;
            transform: none !important;
            box-shadow: none !important;
            border-color: rgba(255, 255, 255, 0.05) !important;
        }

        .row-locked .btn-vid-toggle {
            display: none !important;
        }

        /* Modal Image Picker Curation & Carousel */
        .modal-curation-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            gap: 10px;
            flex-wrap: wrap;
        }

        .modal-candidate-badge {
            font-size: 12px;
            color: #94a3b8;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            max-width: 320px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .modal-curation-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-preview-stage {
            display: flex;
            align-items: center;
            justify-content: center;
            max-height: 52vh;
            width: 100%;
            margin-bottom: 12px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 8px;
        }

        .modal-preview-stage img {
            max-height: 48vh;
            max-width: 100%;
            object-fit: contain;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .modal-carousel-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .modal-carousel-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .modal-carousel-strip {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 6px 2px 8px 2px;
            scrollbar-width: thin;
            scrollbar-color: rgba(99, 102, 241, 0.5) rgba(15, 23, 42, 0.4);
            max-width: 82vw;
        }

        .modal-carousel-strip::-webkit-scrollbar {
            height: 6px;
        }

        .modal-carousel-strip::-webkit-scrollbar-thumb {
            background: #6366f1;
            border-radius: 4px;
        }

        .modal-carousel-thumb {
            width: 72px;
            height: 48px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
            opacity: 0.7;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .modal-carousel-thumb:hover {
            opacity: 1;
            transform: translateY(-2px);
            border-color: rgba(99, 102, 241, 0.5);
        }

        .modal-carousel-thumb.active {
            opacity: 1;
            border-color: #6366f1;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.6);
            transform: scale(1.05);
        }

        .form-group-compact {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            color: var(--text-main);
            font-size: 12px;
        }

        label i {
            color: var(--primary);
        }

        input[type="text"] {
            width: 100%;
            padding: 8px 12px;
            background-color: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Queue Section - Expands to fill viewport */
        #queueSection {
            flex: 1;
            min-height: 0;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .queue-summary-card {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            margin-bottom: 10px;
            background: rgba(99, 102, 241, 0.08);
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 10px;
            font-size: 12px;
        }

        .queue-summary-stats {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .table-container {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            border-radius: 10px;
            border: 1px solid var(--panel-border);
            background: rgba(15, 23, 42, 0.4);
            scrollbar-width: thin;
            scrollbar-color: rgba(99, 102, 241, 0.5) rgba(15, 23, 42, 0.2);
            position: relative;
        }

        .table-container::-webkit-scrollbar {
            width: 8px;
        }

        .table-container::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.3);
            border-radius: 8px;
            margin: 4px;
        }

        .table-container::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            table-layout: fixed;
        }

        th {
            background-color: #1e293b;
            color: var(--text-muted);
            padding: 10px 14px;
            font-size: 12px;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid var(--panel-border);
        }

        td {
            padding: 12px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            vertical-align: top;
            font-size: 12px;
            word-wrap: break-word;
        }

        select {
            background-color: rgba(15, 23, 42, 0.8);
            color: #fff;
            border: 1px solid var(--panel-border);
            padding: 6px 10px;
            border-radius: 6px;
            width: 100%;
            cursor: pointer;
            margin-top: 6px;
            font-size: 12px;
        }

        video.input-video-preview {
            width: 220px;
            height: 124px;
            object-fit: cover;
            border-radius: 8px;
            background: #000;
            display: none;
            margin-top: 6px;
        }

        img.preview-image {
            width: 110px;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
            background: #000;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        img.preview-image:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
            border-color: var(--primary);
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 11px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .status-wait {
            background-color: rgba(156, 163, 175, 0.15);
            color: #9ca3af;
            border: 1px solid rgba(156, 163, 175, 0.3);
        }

        .status-running {
            background-color: rgba(99, 102, 241, 0.18);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.4);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.2);
        }

        .status-done {
            background-color: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-prefetched {
            background-color: rgba(245, 158, 11, 0.18);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.4);
            box-shadow: 0 0 8px rgba(245, 158, 11, 0.15);
        }

        .status-prefetching {
            background-color: rgba(59, 130, 246, 0.18);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.4);
        }

        .status-error {
            background-color: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .eta-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(245, 158, 11, 0.12);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 12px;
            padding: 2px 7px;
            font-size: 11px;
            font-weight: 500;
        }

        /* Lyrics classification badges */
        .badge-lyrics {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.35);
            border-radius: 10px;
            padding: 2px 7px;
            font-size: 10px;
            font-weight: 600;
        }

        .badge-no-lyrics {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.35);
            border-radius: 10px;
            padding: 2px 7px;
            font-size: 10px;
            font-weight: 600;
        }

        .progress-bar-wrapper {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 5px;
            height: 6px;
            overflow: hidden;
            display: none;
            margin-top: 6px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6366f1, #10b981);
            transition: width 0.3s ease;
        }

        /* Timeline Accordion Styles */
        .stage-timeline {
            display: none;
            margin-top: 8px;
            padding: 8px 10px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            animation: fadeIn 0.2s ease-out;
        }

        .stage-step {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            margin-bottom: 4px;
            color: var(--text-muted);
        }

        .stage-step:last-child {
            margin-bottom: 0;
        }

        .step-icon {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            flex-shrink: 0;
        }

        .step-pending .step-icon {
            background: rgba(255, 255, 255, 0.08);
            color: #64748b;
        }

        .step-active .step-icon {
            background: rgba(99, 102, 241, 0.25);
            color: #818cf8;
            border: 1px solid var(--primary);
        }

        .step-completed .step-icon {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
        }

        .step-failed .step-icon {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .step-active {
            color: #fff;
            font-weight: 600;
        }

        .step-completed {
            color: #cbd5e1;
        }

        .step-failed {
            color: #f87171;
            font-weight: 600;
        }

        .step-duration {
            margin-left: auto;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            font-size: 10px;
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 6px;
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid var(--primary);
            color: #a5b4fc;
        }

        .btn-sm:hover {
            background: rgba(99, 102, 241, 0.4);
            color: #fff;
        }

        .btn-toggle-steps {
            background: none;
            border: none;
            color: #818cf8;
            font-size: 11px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-toggle-steps:hover {
            text-decoration: underline;
            color: #a5b4fc;
        }

        /* Media Modal / Lightbox Overlay */
        .media-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .media-modal.active {
            display: flex;
        }

        .media-modal-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
        }

        .media-modal-content {
            position: relative;
            z-index: 1001;
            max-width: 90vw;
            max-height: 90vh;
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            animation: zoomIn 0.2s ease-out;
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .media-modal-close {
            position: absolute;
            top: 10px;
            right: 14px;
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 26px;
            cursor: pointer;
            line-height: 1;
        }

        .media-modal-close:hover {
            color: #fff;
        }

        .media-modal-title {
            color: #e5e7eb;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
            max-width: 80vw;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .media-modal-body img {
            max-width: 85vw;
            max-height: 75vh;
            object-fit: contain;
            border-radius: 8px;
        }

        /* Modal Zoom & Pan Stage Styles */
        .modal-preview-stage {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 52vh;
            min-height: 280px;
            max-height: 520px;
            background: rgba(10, 14, 23, 0.9);
            border-radius: 10px;
            margin-bottom: 12px;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }

        .modal-preview-stage img,
        .media-modal-body img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 6px;
            transform-origin: center center;
            will-change: transform;
            transition: transform 0.04s ease-out;
            cursor: zoom-in;
        }

        .modal-preview-stage img.zoomed,
        .media-modal-body img.zoomed {
            cursor: grab;
        }

        .modal-preview-stage img.grabbing,
        .media-modal-body img.grabbing {
            cursor: grabbing !important;
            transition: none; /* Không trễ khi kéo rê */
        }

        /* Modal Zoom Badge & Controls */
        .modal-zoom-badge {
            position: absolute;
            top: 10px;
            right: 48px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(99, 102, 241, 0.4);
            color: #a5b4fc;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            pointer-events: none;
            z-index: 10;
            backdrop-filter: blur(4px);
            display: none;
            animation: fadeIn 0.15s ease-out;
        }

        .modal-zoom-reset-btn {
            position: absolute;
            top: 8px;
            right: 12px;
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #cbd5e1;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            font-size: 11px;
            transition: all 0.2s ease;
        }

        .modal-zoom-reset-btn:hover {
            background: rgba(99, 102, 241, 0.5);
            color: #fff;
            transform: scale(1.1);
        }

        .media-modal-body video {
            max-width: 85vw;
            max-height: 75vh;
            aspect-ratio: 9/16;
            background: #000;
            border-radius: 8px;
        }

        /* --- Multi-Image Slideshow Controls --- */
        .multi-image-toggle-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }

        .switch-sm {
            position: relative;
            display: inline-block;
            width: 30px;
            height: 16px;
            flex-shrink: 0;
        }

        .switch-sm input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider-sm {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #374151;
            transition: .2s;
            border-radius: 16px;
        }

        .slider-sm:before {
            position: absolute;
            content: "";
            height: 12px;
            width: 12px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .2s;
            border-radius: 50%;
        }

        .switch-sm input:checked + .slider-sm {
            background-color: var(--primary);
        }

        .switch-sm input:focus + .slider-sm {
            box-shadow: 0 0 1px var(--primary);
        }

        .switch-sm input:checked + .slider-sm:before {
            transform: translateX(14px);
        }

        .toggle-label {
            font-size: 11px;
            font-weight: 500;
            color: #cbd5e1;
            user-select: none;
        }

        .stepper-controls {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            background: rgba(15, 23, 42, 0.7);
            padding: 2px 4px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .btn-step {
            width: 20px;
            height: 20px;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            color: #f3f4f6;
            border-radius: 4px;
            font-weight: bold;
            font-size: 13px;
            line-height: 1;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .btn-step:hover:not(:disabled) {
            background: var(--primary);
            color: #fff;
        }

        .btn-step:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .stepper-count-badge {
            font-size: 11px;
            font-weight: 600;
            color: #a5b4fc;
            padding: 0 4px;
            min-width: 44px;
            text-align: center;
            user-select: none;
        }

        .multi-thumb-stack {
            display: flex;
            align-items: center;
            cursor: pointer;
            margin-top: 4px;
        }

        .badge-slideshow {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            background: rgba(99, 102, 241, 0.18);
            color: #c7d2fe;
            border: 1px solid rgba(99, 102, 241, 0.35);
            padding: 3px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .badge-slideshow:hover {
            background: rgba(99, 102, 241, 0.35);
            color: #fff;
            border-color: rgba(99, 102, 241, 0.6);
        }

        /* --- Multi-Image Modal Styles --- */
        .multi-modal-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            gap: 10px;
            flex-wrap: wrap;
        }

        .multi-gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
            width: 100%;
            max-height: 48vh;
            overflow-y: auto;
            padding: 4px;
            margin-bottom: 12px;
        }

        .multi-slot-card {
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            overflow: hidden;
            background: rgba(17, 24, 39, 0.9);
            position: relative;
            display: flex;
            flex-direction: column;
            transition: all 0.2s ease;
        }

        .multi-slot-card.active {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.4);
        }

        .multi-slot-img {
            width: 100%;
            aspect-ratio: 9/16;
            object-fit: cover;
            background: #000;
            display: block;
            cursor: pointer;
        }

        .multi-slot-idx {
            position: absolute;
            top: 4px;
            left: 4px;
            background: rgba(0, 0, 0, 0.75);
            color: #a5b4fc;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            pointer-events: none;
        }

        .multi-slot-remove {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(239, 68, 68, 0.85);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .multi-slot-remove:hover {
            background: #ef4444;
            transform: scale(1.1);
        }

        .multi-slot-info {
            padding: 4px 6px;
            font-size: 9px;
            color: #94a3b8;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
            text-align: center;
        }

        .multi-slot-btn {
            margin: 2px 4px 6px 4px;
            padding: 3px 6px;
            font-size: 10px;
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.35);
            color: #c7d2fe;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease;
        }

        .multi-slot-btn:hover {
            background: var(--primary);
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header & Action Controls Bar (Pinned at top) -->
        <div class="header-nav">
            <div class="header-title">
                <h2><i class="fa-solid fa-wand-magic-sparkles"></i> Auto Render Video</h2>
            </div>
            <div class="header-actions">
                <button id="startBtn" class="btn btn-success" onclick="startBatchRender()" disabled>
                    <i class="fa-solid fa-rocket"></i> <span id="startBtnText">Bắt Đầu Render</span>
                </button>
                <button id="stopBtn" class="btn btn-danger" onclick="stopBatchRender()" style="display: none;">
                    <i class="fa-solid fa-hand"></i> <span>Dừng Lại</span>
                </button>
                <button id="reloadBtn" class="btn btn-secondary" onclick="refreshQueueState()"
                    title="Làm mới hàng đợi và quét thêm video mới (không gián đoạn render)">
                    <i class="fa-solid fa-rotate-right"></i> <span>Làm Mới</span>
                </button>
                <a href="/manage" class="btn btn-outline">
                    <i class="fa-solid fa-list-check"></i> <span>Quản Lý Video</span>
                </a>
            </div>
        </div>

        <!-- Setup Thư Mục (Tự động thu gọn sau khi quét) -->
        <div id="setupSection">
            <div id="setupSummaryBar">
                <span id="setupSummaryText"
                    style="font-size: 13px; color: #cbd5e1; display: inline-flex; align-items: center; gap: 8px;">
                    <i class="fa-solid fa-folder-check" style="color: var(--success);"></i> Đã quét thư mục
                </span>
                <span id="setupProfileBadge" style="font-size: 11px; padding: 2px 8px; border-radius: 12px; background: rgba(99, 102, 241, 0.2); color: #a5b4fc; border: 1px solid rgba(99, 102, 241, 0.4);">
                    <i class="fa-solid fa-bolt"></i> Tốc độ tối đa
                </span>
                <button class="btn btn-secondary btn-sm" onclick="toggleSetupSection(true)" style="padding: 4px 10px;">
                    <i class="fa-solid fa-pen-to-square"></i> Đổi thư mục
                </button>
            </div>
            <div class="setup-expanded-content">
                <div class="form-group-compact">
                    <label><i class="fa-regular fa-image"></i> Thư mục Ảnh nguồn:</label>
                    <input type="text" id="imageFolderPath" placeholder="Ví dụ: D:\Media\Images">
                </div>

                <div class="form-group-compact">
                    <label><i class="fa-solid fa-film"></i> Thư mục Video nguồn:</label>
                    <input type="text" id="videoFolderPath" placeholder="Ví dụ: D:\Media\Videos">
                </div>

                <div class="form-group-compact" style="min-width: 175px;">
                    <label><i class="fa-solid fa-gauge-high"></i> Cấu hình hiệu năng:</label>
                    <select id="performanceProfileSelect" onchange="changePerformanceProfile(this.value)" style="padding: 7px 10px; border-radius: 6px; background: rgba(30, 41, 59, 0.9); color: #f1f5f9; border: 1px solid rgba(255, 255, 255, 0.15); font-size: 12px; outline: none; cursor: pointer;">
                        <option value="max_speed">⚡ Tốc độ tối đa (GPU/Ultrafast)</option>
                        <option value="balanced">⚖️ Cân bằng (Chất lượng cao)</option>
                    </select>
                </div>

                <button id="scanBtn" class="btn" onclick="loadFolders()" style="padding: 9px 18px;">
                    <i id="scanIcon" class="fa-solid fa-folder-open"></i> <span id="scanText">Quét Thư Mục</span>
                </button>
            </div>
        </div>

        <!-- Hàng Đợi & Render (Khu vực cuộn độc lập) -->
        <div id="queueSection">
            <!-- Thẻ tóm tắt hàng đợi & dự đoán tổng thời gian -->
            <div id="queueSummaryCard" class="queue-summary-card">
                <div class="queue-summary-stats">
                    <span><i class="fa-solid fa-list"></i> Tổng: <strong id="summaryTotal">0</strong></span>
                    <span><i class="fa-solid fa-circle-check" style="color: var(--success);"></i> Đã xong: <strong
                            id="summaryDone">0</strong></span>
                    <span><i class="fa-solid fa-hourglass-half" style="color: var(--warning);"></i> Chờ xử lý: <strong
                            id="summaryPending">0</strong></span>
                </div>
                <div>
                    <span id="queueEtaBadge" class="eta-badge">
                        <i class="fa-solid fa-bolt"></i> Dự đoán tổng: <strong id="summaryEtaText">Đang tính...</strong>
                    </span>
                </div>
            </div>

            <div class="table-container" id="tableContainer">
                <table id="queueTable">
                    <thead>
                        <tr>
                            <th style="width: 32%;">Video Nguồn</th>
                            <th style="width: 22%;">Ảnh Ghép Mẫu</th>
                            <th style="width: 28%;">Tiến Độ & Trạng Thái</th>
                            <th style="width: 18%;">Thành Phẩm</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Lightbox phóng to ảnh và video (Nền mờ tối, đóng nhanh) -->
    <div id="mediaModal" class="media-modal">
        <div class="media-modal-backdrop" onclick="closeMediaModal()"></div>
        <div class="media-modal-content">
            <button class="media-modal-close" onclick="closeMediaModal()" title="Đóng (Esc)">&times;</button>
            <h4 id="mediaModalTitle" class="media-modal-title"></h4>
            <div id="mediaModalBody" class="media-modal-body"></div>
        </div>
    </div>

    <script>
        let rawQueueData = [];
        let availableImages = [];
        let predictionsMap = {};
        let isRunning = false;
        let pollInterval = null;

        const STAGE_DEFS = [
            { id: "audio_extraction", label: "Trích xuất âm thanh", ceiling: 10 },
            { id: "speech_transcription", label: "Nhận diện giọng nói (Whisper)", ceiling: 40 },
            { id: "lyric_refinement", label: "Làm sạch lời bài hát AI", ceiling: 60 },
            { id: "visual_generation", label: "Tạo hình ảnh & lyrics", ceiling: 70 },
            { id: "media_encoding", label: "Ghép video & mã hóa MP4", ceiling: 95 },
            { id: "finalization", label: "Xác thực & dọn dẹp", ceiling: 100 }
        ];

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/get-config');
                const data = await res.json();
                if (data.success && data.config) {
                    if (data.config.image_folder) document.getElementById('imageFolderPath').value = data.config.image_folder;
                    if (data.config.video_folder) document.getElementById('videoFolderPath').value = data.config.video_folder;
                    if (data.config.performance_profile) {
                        const selectEl = document.getElementById('performanceProfileSelect');
                        if (selectEl) selectEl.value = data.config.performance_profile;
                        updateProfileBadge(data.config.performance_profile);
                    }
                }
            } catch (err) { }
        });

        function updateProfileBadge(profile) {
            const badge = document.getElementById('setupProfileBadge');
            if (!badge) return;
            if (profile === 'balanced') {
                badge.innerHTML = '<i class="fa-solid fa-scale-balanced" style="color: #60a5fa;"></i> Cân bằng';
                badge.style.borderColor = 'rgba(59, 130, 246, 0.4)';
                badge.style.color = '#93c5fd';
            } else {
                badge.innerHTML = '<i class="fa-solid fa-bolt" style="color: #fbbf24;"></i> Tốc độ tối đa';
                badge.style.borderColor = 'rgba(99, 102, 241, 0.4)';
                badge.style.color = '#a5b4fc';
            }
        }

        async function changePerformanceProfile(newProfile) {
            updateProfileBadge(newProfile);
            try {
                await fetch('/api/update-performance-profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ performance_profile: newProfile })
                });
            } catch (err) {
                console.error("Lỗi cập nhật cấu hình hiệu năng:", err);
            }
        }

        // Định dạng thời gian thuần số nguyên giây (loại bỏ phần thập phân)
        function formatDuration(sec) {
            if (sec === undefined || sec === null || isNaN(sec)) return '0s';
            const s = Math.round(Number(sec));
            if (s < 60) return `~${s}s`;
            const m = Math.floor(s / 60);
            const remS = s % 60;
            return `~${m}p ${remS}s`;
        }

        function formatSecondsStrict(sec) {
            if (sec === undefined || sec === null || isNaN(sec)) return '0s';
            const s = Math.round(Number(sec));
            if (s < 60) return `${s}s`;
            const m = Math.floor(s / 60);
            const remS = s % 60;
            return `${m}p ${remS}s`;
        }

        function formatShortPath(path) {
            if (!path) return '';
            const clean = path.replace(/\\/g, '/').replace(/\/+$/, '');
            const parts = clean.split('/');
            if (parts.length <= 2) return path;
            const drive = parts[0];
            const folder = parts[parts.length - 1];
            return `${drive}/.../${folder}`;
        }

        function toggleSetupSection(expand) {
            const sec = document.getElementById('setupSection');
            if (!sec) return;
            if (expand) {
                sec.classList.remove('collapsed');
            } else {
                sec.classList.add('collapsed');
            }
        }

        async function loadFolders() {
            const imageFolder = document.getElementById('imageFolderPath').value.trim();
            const videoFolder = document.getElementById('videoFolderPath').value.trim();

            if (!imageFolder || !videoFolder) {
                alert('Vui lòng nhập đầy đủ đường dẫn cả 2 thư mục!');
                return;
            }

            const scanBtn = document.getElementById('scanBtn');
            const scanIcon = document.getElementById('scanIcon');
            const scanText = document.getElementById('scanText');

            scanBtn.disabled = true;
            scanIcon.className = "fa-solid fa-spinner fa-spin";
            scanText.innerText = "Đang quét...";

            try {
                const perfProfile = document.getElementById('performanceProfileSelect')?.value || 'max_speed';
                const res = await fetch('/api/load-folders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image_folder: imageFolder, video_folder: videoFolder, performance_profile: perfProfile })
                });
                const data = await res.json();

                if (data.success) {
                    availableImages = data.available_images;
                    rawQueueData = data.queue;

                    // Tự động thu gọn thanh nhập thư mục thành đường dẫn rút gọn
                    toggleSetupSection(false);
                    const shortImg = formatShortPath(imageFolder);
                    const shortVid = formatShortPath(videoFolder);
                    document.getElementById('setupSummaryText').innerHTML = `
                        <span title="${imageFolder}" style="cursor: pointer; display: inline-flex; align-items: center; gap: 5px;">
                            <i class="fa-regular fa-image" style="color: var(--primary);"></i> <strong>${shortImg}</strong>
                        </span>
                        <span style="color: #64748b; margin: 0 4px;">•</span>
                        <span title="${videoFolder}" style="cursor: pointer; display: inline-flex; align-items: center; gap: 5px;">
                            <i class="fa-solid fa-film" style="color: var(--success);"></i> <strong>${shortVid}</strong>
                        </span>
                    `;

                    // Lấy dự đoán thời gian render
                    await fetchPredictions();

                    renderQueueTable();
                    updateQueueSummary();

                    document.getElementById('queueSection').style.display = 'flex';
                    const startBtn = document.getElementById('startBtn');
                    if (rawQueueData.length > 0) {
                        startBtn.disabled = false;
                    }
                    resetScanButton(scanBtn, scanIcon, scanText);
                } else {
                    alert('Lỗi: ' + data.error);
                    resetScanButton(scanBtn, scanIcon, scanText);
                }
            } catch (err) {
                alert('Không thể kết nối đến server!');
                resetScanButton(scanBtn, scanIcon, scanText);
            }
        }

        function resetScanButton(btn, icon, text) {
            btn.disabled = false;
            icon.className = "fa-solid fa-folder-open";
            text.innerText = "Quét Thư Mục";
        }

        // Dự đoán và cập nhật động toàn bộ hàng đợi
        async function fetchPredictions() {
            try {
                const res = await fetch('/api/render-predictions');
                const data = await res.json();
                if (data.success && data.predictions) {
                    predictionsMap = {};
                    data.predictions.forEach(p => {
                        predictionsMap[p.id] = p.estimated_total_s;
                    });
                    const totalSec = data.total_queue_estimate_s || 0;
                    document.getElementById('summaryEtaText').innerText = formatDuration(totalSec);

                    // Cập nhật nhãn dự đoán cho các item chưa render
                    rawQueueData.forEach(qItem => {
                        if (qItem.status !== 'Hoàn thành') {
                            const badgeEl = document.getElementById(`eta-badge-${qItem.id}`);
                            if (badgeEl && predictionsMap[qItem.id] !== undefined) {
                                badgeEl.innerHTML = `<i class="fa-regular fa-clock"></i> ${formatDuration(predictionsMap[qItem.id])}`;
                            }
                        }
                    });
                }
            } catch (err) {
                console.error("Lỗi lấy dự đoán render:", err);
            }
        }

        function updateQueueSummary() {
            const total = rawQueueData.length;
            const done = rawQueueData.filter(x => x.status === 'Hoàn thành').length;
            const pending = total - done;

            document.getElementById('summaryTotal').innerText = total;
            document.getElementById('summaryDone').innerText = done;
            document.getElementById('summaryPending').innerText = pending;
        }

        let imagePickerSession = {
            itemId: null,
            originalImage: '',
            candidateImage: ''
        };
        let isRefreshing = false;

        function scrollToActiveRow(rowEl) {
            const tableContainer = document.getElementById('tableContainer');
            if (!rowEl || !tableContainer) return;
            // Header <th> is sticky with ~42px height.
            // Offset scroll by 42px so active row aligns flush directly beneath <th>
            const targetScroll = Math.max(0, rowEl.offsetTop - 42);
            tableContainer.scrollTo({ top: targetScroll, behavior: 'smooth' });
        }

        function renderQueueTable() {
            const tbody = document.querySelector('#queueTable tbody');
            tbody.innerHTML = '';
            const vidFolderPath = document.getElementById('videoFolderPath').value.trim();

            rawQueueData.forEach((item, idx) => {
                const vidFullPath = `${vidFolderPath}\\${item.video_name}`;
                const estTime = predictionsMap[item.id] ? formatDuration(predictionsMap[item.id]) : "~30s";
                const isCompleted = (item.status === 'Hoàn thành' || item.is_locked);

                const tr = document.createElement('tr');
                tr.id = `row-${item.id}`;
                if (isCompleted) {
                    tr.classList.add('row-locked');
                }

                // Cột 1: Video nguồn gọn gàng (không hiển thị tên file dài dòng, chỉ có số thứ tự #, ETA badge, nút preview)
                const col1Html = `
                    <td>
                        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
                            <span style="font-weight: 700; font-size: 13px; color: #a5b4fc; background: rgba(99, 102, 241, 0.15); padding: 2px 8px; border-radius: 6px; border: 1px solid rgba(99, 102, 241, 0.3);" title="${item.video_name}">
                                #${idx + 1}
                            </span>
                            <span id="eta-badge-${item.id}" class="eta-badge" title="Thời gian render dự kiến (video ~${Math.round(item.duration_s || 30)}s)">
                                <i class="fa-regular fa-clock"></i> ${estTime}
                            </span>
                        </div>
                        ${!isCompleted ? `
                            <button class="btn btn-sm btn-vid-toggle" id="btn-vid-toggle-${item.id}" onclick="toggleVideo(${item.id}, '${encodeURIComponent(vidFullPath)}')">
                                <i class="fa-solid fa-eye"></i> Hiện video
                            </button>
                            <video class="input-video-preview" id="input-vid-${item.id}" controls preload="none"></video>
                        ` : ''}
                    </td>
                `;

                // Cột 2: Ảnh ghép mẫu - hiển thị đơn ảnh hoặc nhiều ảnh tùy công tắc
                const isMulti = Boolean(item.is_multi_image);
                const imgCount = item.image_count || 10;
                const col2Html = `
                    <td class="col-image-config">
                        <!-- Toggle Switch: Ghép nhiều ảnh -->
                        <div class="multi-image-toggle-bar">
                            <label class="switch-sm" title="Bật/Tắt chế độ ghép nhiều ảnh chạy slideshow">
                                <input type="checkbox" id="multi-toggle-${item.id}" ${isMulti ? 'checked' : ''} ${isCompleted ? 'disabled' : ''} onchange="toggleMultiImageMode(${item.id})">
                                <span class="slider-sm round"></span>
                            </label>
                            <span class="toggle-label">Nhiều ảnh</span>
                        </div>

                        <!-- Mode 1: Đơn ảnh (Mặc định) -->
                        <div id="single-image-box-${item.id}" style="${isMulti ? 'display: none;' : 'display: flex; flex-direction: column; align-items: flex-start; gap: 4px;'}">
                            <img class="preview-image" 
                                 src="/media/image-by-name/${encodeURIComponent(item.image_name)}" 
                                 id="img-preview-${item.id}" 
                                 onclick="${isCompleted ? '' : `openImagePickerModal(${item.id})`}" 
                                 title="${isCompleted ? 'Đã render - không thể đổi ảnh' : 'Nhấp để xem và đổi ảnh mẫu'}">
                            ${!isCompleted ? `
                                <span style="font-size: 10px; color: #94a3b8; cursor: pointer;" onclick="openImagePickerModal(${item.id})">
                                    <i class="fa-solid fa-wand-magic-sparkles"></i> Đổi ảnh
                                </span>
                            ` : ''}
                        </div>

                        <!-- Mode 2: Nhiều ảnh (Slideshow) -->

        function getStatusBadgeClass(status) {
            if (status === 'Đang render') return 'status-running';
            if (status === 'Hoàn thành') return 'status-done';
            if (status === 'Lỗi') return 'status-error';
            if (status === 'Đã nạp trước' || status === 'ready') return 'status-prefetched';
            if (status === 'Đang nạp nền...' || status === 'in_progress') return 'status-prefetching';
            return 'status-wait';
        }

        function getStatusBadgeIcon(status) {
            if (status === 'Đang render') return '<i class="fa-solid fa-spinner fa-spin"></i>';
            if (status === 'Hoàn thành') return '<i class="fa-solid fa-circle-check"></i>';
            if (status === 'Lỗi') return '<i class="fa-solid fa-circle-exclamation"></i>';
            if (status === 'Đã nạp trước' || status === 'ready') return '<i class="fa-solid fa-bolt" style="color: #fbbf24;"></i>';
            if (status === 'Đang nạp nền...' || status === 'in_progress') return '<i class="fa-solid fa-spinner fa-spin" style="color: #60a5fa;"></i>';
            return '<i class="fa-regular fa-clock"></i>';
        }

        function toggleTimeline(id) {

            if (tl.style.display === 'block') {
                tl.style.display = 'none';
                if (chevron) chevron.className = 'fa-solid fa-chevron-down';
            } else {
                tl.style.display = 'block';
                if (chevron) chevron.className = 'fa-solid fa-chevron-up';

            if (videoEl.style.display === 'none' || videoEl.style.display === '') {

        // --- MODAL IMAGE WHEEL ZOOM & PAN CONTROLLER ---
        const ModalZoomController = {
            scale: 1.0,
            minScale: 1.0,
            maxScale: 5.0,
            translateX: 0,
            translateY: 0,
            isDragging: false,
            startX: 0,
            startY: 0,
            targetImgEl: null,
            badgeEl: null,
            resetBtnEl: null,
            containerEl: null,

            init(containerId, imgId, badgeId, resetBtnId) {
                this.reset();
                this.containerEl = document.getElementById(containerId);
                this.targetImgEl = document.getElementById(imgId);
                this.badgeEl = document.getElementById(badgeId);
                this.resetBtnEl = document.getElementById(resetBtnId);

                if (!this.containerEl || !this.targetImgEl) return;

                // Thao tác cuộn chuột zoom mượt, ngăn chặn cuộn trang
                this.containerEl.onwheel = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const delta = -e.deltaY;
                    const zoomFactor = delta > 0 ? 1.15 : (1 / 1.15);
                    let newScale = this.scale * zoomFactor;

                    if (newScale > this.maxScale) newScale = this.maxScale;
                    if (newScale < this.minScale) newScale = this.minScale;

                    if (newScale <= this.minScale) {
                        this.translateX = 0;
                        this.translateY = 0;
                    }

                    this.scale = newScale;
                    this.applyTransform();
                };

                // Kéo rê (pan) khi ảnh đang phóng to
                this.targetImgEl.onmousedown = (e) => {
                    if (this.scale <= 1.05) return;
                    e.preventDefault();
                    e.stopPropagation();
                    this.isDragging = true;
                    this.startX = e.clientX - this.translateX;
                    this.startY = e.clientY - this.translateY;
                    this.targetImgEl.classList.add('grabbing');
                };

                window.removeEventListener('mousemove', this.boundOnMouseMove);
                window.removeEventListener('mouseup', this.boundOnMouseUp);

                this.boundOnMouseMove = (e) => this.onMouseMove(e);
                this.boundOnMouseUp = () => this.onMouseUp();

                window.addEventListener('mousemove', this.boundOnMouseMove);
                window.addEventListener('mouseup', this.boundOnMouseUp);

                // Nhấp đúp chuột để reset zoom về 100%
                this.targetImgEl.ondblclick = (e) => {
                    e.preventDefault();
                    this.reset();
                };
            },

            onMouseMove(e) {
                if (!this.isDragging || !this.targetImgEl) return;
                this.translateX = e.clientX - this.startX;
                this.translateY = e.clientY - this.startY;
                this.applyTransform();
            },

            onMouseUp() {
                if (this.isDragging) {
                    this.isDragging = false;
                    if (this.targetImgEl) this.targetImgEl.classList.remove('grabbing');
                }
            },

            applyTransform() {
                if (!this.targetImgEl) return;
                const roundedScale = Math.round(this.scale * 100) / 100;
                this.targetImgEl.style.transform = `translate3d(${this.translateX}px, ${this.translateY}px, 0) scale(${roundedScale})`;

                if (roundedScale > 1.05) {
                    this.targetImgEl.classList.add('zoomed');
                    if (this.badgeEl) {
                        this.badgeEl.style.display = 'block';
                        this.badgeEl.innerText = `${Math.round(roundedScale * 100)}%`;
                    }
                    if (this.resetBtnEl) {
                        this.resetBtnEl.style.display = 'inline-flex';
                    }
                } else {
                    this.targetImgEl.classList.remove('zoomed');
                    this.targetImgEl.classList.remove('grabbing');
                    if (this.badgeEl) this.badgeEl.style.display = 'none';
                    if (this.resetBtnEl) this.resetBtnEl.style.display = 'none';
                }
            },

            reset() {
                this.scale = 1.0;
                this.translateX = 0;
                this.translateY = 0;
                this.isDragging = false;
                if (this.targetImgEl) {
                    this.targetImgEl.style.transform = 'translate3d(0px, 0px, 0) scale(1)';
                    this.targetImgEl.classList.remove('zoomed');
                    this.targetImgEl.classList.remove('grabbing');
                }
                if (this.badgeEl) this.badgeEl.style.display = 'none';
                if (this.resetBtnEl) this.resetBtnEl.style.display = 'none';
            }
        };

            };

                </div>

                        <i class="fa-solid fa-arrows-rotate"></i>
                    </button>
                </div>

                    </div>
                    <div class="modal-carousel-strip" id="modalCarouselStrip">

                }

        function selectCandidateImage(imgName) {
            ModalZoomController.reset();
            imagePickerSession.candidateImage = imgName;
            const imgEl = document.getElementById('modalCandidateImg');
            if (imgEl) {
                imgEl.src = `/media/image-by-name/${encodeURIComponent(imgName)}`;
            }
            const badgeEl = document.querySelector('.modal-candidate-badge');
            if (badgeEl) {
                badgeEl.innerHTML = `<i class="fa-solid fa-image" style="color: var(--primary);"></i> Đang chọn: <strong>${imgName}</strong>`;
                badgeEl.title = imgName;
            }
            const strip = document.getElementById('modalCarouselStrip');
            if (strip) {
                strip.querySelectorAll('.modal-carousel-thumb').forEach(thumb => {
                    if (thumb.title === imgName) {
                        thumb.classList.add('active');
                        thumb.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                    } else {
                        thumb.classList.remove('active');
                    }
                });
            }

        async function pickRandomImage() {
            try {
                const res = await fetch('/api/random-image');
                const data = await res.json();
                if (data.success && data.image_name) {
                    const chosen = data.image_name;
                    if (!availableImages.includes(chosen)) {
                        availableImages.unshift(chosen);
                        renderImagePickerModalContent();
                    }
                    selectCandidateImage(chosen);
                    return;
                }
            } catch (e) { }

            // Fallback chọn từ danh sách đã tải
            if (!availableImages || availableImages.length === 0) return;
            if (availableImages.length === 1) {
                alert('Thư mục chỉ có duy nhất 1 ảnh!');
                return;
            }
            const current = imagePickerSession.candidateImage;
            const candidates = availableImages.filter(x => x !== current);
            const chosen = candidates[Math.floor(Math.random() * candidates.length)];
            selectCandidateImage(chosen);
        }

        async function confirmImageSwap() {
            const btn = document.getElementById('btnConfirmImageSwap');
            if (btn) btn.disabled = true;

            const { itemId, candidateImage } = imagePickerSession;
            try {
                const res = await fetch('/api/update-queue', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: itemId, image_name: candidateImage })
                });
                const data = await res.json();
                if (data.success) {
                    const item = rawQueueData.find(x => x.id === itemId);
                    if (item) {
                        item.image_name = candidateImage;
                        const thumbImg = document.getElementById(`img-preview-${itemId}`);
                        if (thumbImg) {
                            thumbImg.src = `/media/image-by-name/${encodeURIComponent(candidateImage)}?t=${Date.now()}`;
                        }
                    }
                    closeMediaModal();
                } else {
                    alert('Lỗi cập nhật ảnh: ' + (data.error || ''));
                }
            } catch (err) {
                alert('Lỗi kết nối khi đổi ảnh!');
            } finally {
                if (btn) btn.disabled = false;
            }
        }

        // --- MULTI-IMAGE SLIDESHOW CLIENT HANDLERS ---
        async function toggleMultiImageMode(id) {
            const item = rawQueueData.find(x => x.id === id);
            if (!item) return;

            const toggleEl = document.getElementById(`multi-toggle-${id}`);
            const isChecked = toggleEl ? toggleEl.checked : false;

            try {
                const res = await fetch('/api/toggle-multi-image', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id, enabled: isChecked })
                });
                const data = await res.json();
                if (data.success && data.item) {
                    item.is_multi_image = Boolean(data.item.is_multi_image);
                    item.image_count = data.item.image_count || 10;
                    item.image_list = data.item.image_list || [];

                    const singleBox = document.getElementById(`single-image-box-${id}`);
                    const multiBox = document.getElementById(`multi-image-box-${id}`);
                    const stepperCount = document.getElementById(`stepper-count-${id}`);
                    const badgeCount = document.getElementById(`badge-count-${id}`);

                    if (singleBox) singleBox.style.display = item.is_multi_image ? 'none' : 'flex';
                    if (multiBox) multiBox.style.display = item.is_multi_image ? 'flex' : 'none';
                    if (stepperCount) stepperCount.textContent = `${item.image_count} ảnh`;
                    if (badgeCount) badgeCount.textContent = `${item.image_count}`;
                } else {
                    alert('Lỗi cập nhật chế độ nhiều ảnh: ' + (data.error || ''));
                    if (toggleEl) toggleEl.checked = !isChecked;
                }
            } catch (err) {
                alert('Lỗi kết nối khi bật/tắt nhiều ảnh!');
                if (toggleEl) toggleEl.checked = !isChecked;
            }
        }

        async function adjustImageCount(id, delta) {
            const item = rawQueueData.find(x => x.id === id);
            if (!item) return;
            const currentCount = item.image_count || 10;
            const nextCount = currentCount + delta;
            if (nextCount < 2) {
                alert('Tối thiểu là 2 ảnh để làm video slideshow!');
                return;
            }
            if (nextCount > 50) {
                alert('Tối đa là 50 ảnh cho mỗi video!');
                return;
            }

            try {
                const res = await fetch('/api/update-multi-count', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id, count: nextCount, delta: delta })
                });
                const data = await res.json();
                if (data.success && data.item) {
                    item.image_count = data.item.image_count;
                    item.image_list = data.item.image_list;

                    const stepperCount = document.getElementById(`stepper-count-${id}`);
                    const badgeCount = document.getElementById(`badge-count-${id}`);
                    if (stepperCount) stepperCount.textContent = `${item.image_count} ảnh`;
                    if (badgeCount) badgeCount.textContent = `${item.image_count}`;
                } else {
                    alert('Lỗi cập nhật số lượng ảnh: ' + (data.error || ''));
                }
            } catch (err) {
                alert('Lỗi kết nối khi tăng/giảm số lượng ảnh!');
            }
        }
