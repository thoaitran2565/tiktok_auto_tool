                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="badge-slideshow" style="cursor: default; font-size: 11px; padding: 4px 10px;">
                            <i class="fa-solid fa-images"></i> Tổng cộng: <strong>${count}</strong> ảnh
                        </span>
                        <span style="font-size: 11px; color: #94a3b8;">(Thứ tự ảnh sẽ trượt ngang từ phải sang trái lần lượt từ #1 đến #${count})</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <button class="btn btn-secondary btn-sm" onclick="rerollMultiImageBatchModal()" title="Đổi ngẫu nhiên lại toàn bộ ảnh trong bộ">
                            <i class="fa-solid fa-shuffle"></i> Đổi ngẫu nhiên bộ ảnh
                        </button>
                        <button class="btn btn-secondary btn-sm" onclick="addSlotToMultiImage()" title="Thêm 1 ảnh mới vào cuối danh sách">
                            <i class="fa-solid fa-plus"></i> Thêm ảnh
                        </button>
                        <button class="btn btn-success btn-sm" id="btnConfirmMultiImage" onclick="confirmMultiImageChanges()" title="Lưu danh sách ảnh này cho video">
                            <i class="fa-solid fa-check"></i> Lưu & Áp dụng
                        </button>
                    </div>
                </div>

                <div class="multi-gallery-grid" id="multiGalleryGrid">
                    ${imageList.map((imgName, idx) => `
                        <div class="multi-slot-card ${activeSlotIndex === idx ? 'active' : ''}" id="slot-card-${idx}">
                            <span class="multi-slot-idx">#${idx + 1}</span>
                            ${count > 2 ? `
                                <button class="multi-slot-remove" onclick="removeMultiImageSlot(${idx})" title="Xóa ảnh #${idx + 1}">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            ` : ''}
                            <img class="multi-slot-img" 
                                 src="/media/image-by-name/${encodeURIComponent(imgName)}" 
                                 alt="${imgName}" 
                                 onclick="selectMultiSlotForSwap(${idx})"
                                 title="Nhấp để đổi ảnh tại vị trí này">
                            <div class="multi-slot-info" title="${imgName}">${imgName}</div>
                            <button class="multi-slot-btn" onclick="selectMultiSlotForSwap(${idx})">
                                <i class="fa-solid fa-pen-to-square"></i> Đổi ảnh
                            </button>
                        </div>
                    `).join('')}
                </div>

                ${candidateSlotHtml}
            `;

            setTimeout(() => {
                const strip = document.getElementById('multiModalCarouselStrip');
                const activeThumb = strip?.querySelector('.modal-carousel-thumb.active');
                if (activeThumb && strip) {
                    activeThumb.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }
            }, 50);
        }

        function selectMultiSlotForSwap(idx) {
            multiImagePickerSession.activeSlotIndex = idx;
            renderMultiImagePickerModalContent();
        }

        function applyCandidateToActiveSlot(imgName) {
            const { activeSlotIndex, imageList } = multiImagePickerSession;
            if (activeSlotIndex === null || activeSlotIndex < 0 || activeSlotIndex >= imageList.length) return;
            imageList[activeSlotIndex] = imgName;
            renderMultiImagePickerModalContent();
        }

        function removeMultiImageSlot(idx) {
            const { imageList } = multiImagePickerSession;
            if (imageList.length <= 2) {
                alert('Tối thiểu phải có 2 ảnh trong bộ video!');
                return;
            }
            imageList.splice(idx, 1);
            if (multiImagePickerSession.activeSlotIndex >= imageList.length) {
                multiImagePickerSession.activeSlotIndex = imageList.length - 1;
            }
            renderMultiImagePickerModalContent();
        }

        async function addSlotToMultiImage() {
            const { imageList } = multiImagePickerSession;
            if (imageList.length >= 50) {
                alert('Tối đa là 50 ảnh!');
                return;
            }

            const candidates = availableImages.filter(x => !imageList.includes(x));
            const pool = candidates.length > 0 ? candidates : availableImages;
            if (!pool || pool.length === 0) {
                alert('Không có ảnh nào trong thư mục!');
                return;
            }
            const chosen = pool[Math.floor(Math.random() * pool.length)];
            imageList.push(chosen);
            multiImagePickerSession.activeSlotIndex = imageList.length - 1;
            renderMultiImagePickerModalContent();
        }

        async function rerollMultiImageBatchModal() {
            const { itemId, imageList } = multiImagePickerSession;
            const count = Math.max(2, imageList.length || 10);

            try {
                const res = await fetch('/api/random-images-batch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ count: count, exclude: [] })
                });
                const data = await res.json();
                if (data.success && data.images && data.images.length > 0) {
                    multiImagePickerSession.imageList = data.images;
                    multiImagePickerSession.activeSlotIndex = 0;
                    renderMultiImagePickerModalContent();
                } else {
                    alert('Lỗi lấy ảnh ngẫu nhiên: ' + (data.error || ''));
                }
            } catch (e) {
                alert('Lỗi kết nối khi đổi ngẫu nhiên bộ ảnh!');
            }
        }

        async function confirmMultiImageChanges() {
            const btn = document.getElementById('btnConfirmMultiImage');
            if (btn) btn.disabled = true;

            const { itemId, imageList } = multiImagePickerSession;
            if (!imageList || imageList.length < 2) {
                alert('Cần ít nhất 2 ảnh cho chế độ slideshow!');
                if (btn) btn.disabled = false;
                return;
            }

            try {
                const res = await fetch('/api/update-queue', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id: itemId,
                        is_multi_image: true,
                        image_count: imageList.length,
                        image_list: imageList,
                        image_name: imageList[0]
                    })
                });
                const data = await res.json();
                if (data.success) {
                    const item = rawQueueData.find(x => x.id === itemId);
                    if (item) {
                        item.is_multi_image = true;
                        item.image_count = imageList.length;
                        item.image_list = imageList;
                        item.image_name = imageList[0];

                        const stepperCount = document.getElementById(`stepper-count-${itemId}`);
                        const badgeCount = document.getElementById(`badge-count-${itemId}`);
                        const previewThumb = document.getElementById(`img-preview-${itemId}`);

                        if (stepperCount) stepperCount.textContent = `${item.image_count} ảnh`;
                        if (badgeCount) badgeCount.textContent = `${item.image_count}`;
                        if (previewThumb) previewThumb.src = `/media/image-by-name/${encodeURIComponent(imageList[0])}?t=${Date.now()}`;
                    }
                    closeMediaModal();
                } else {
                    alert('Lỗi lưu danh sách ảnh: ' + (data.error || ''));
                }
            } catch (err) {
                alert('Lỗi kết nối khi lưu danh sách ảnh!');
            } finally {
                if (btn) btn.disabled = false;
            }
        }

        // --- NON-DESTRUCTIVE REFRESH QUEUE STATE ---
        async function refreshQueueState() {
            if (isRefreshing) return;
            const reloadBtn = document.getElementById('reloadBtn');
            const originalHtml = reloadBtn.innerHTML;
            isRefreshing = true;
            reloadBtn.disabled = true;
            reloadBtn.innerHTML = '<i class="fa-solid fa-rotate-right fa-spin"></i> <span>Đang đồng bộ...</span>';

            try {
                const res = await fetch('/api/refresh-queue', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                const data = await res.json();
                if (data.success) {
                    availableImages = data.available_images || availableImages;

                    // Giữ nguyên trạng thái render đang chạy hoặc đã xong
                    const serverQueue = data.queue || [];
                    const localMap = {};
                    rawQueueData.forEach(item => localMap[item.id] = item);

                    rawQueueData = serverQueue.map(srvItem => {
                        const local = localMap[srvItem.id];
                        if (local) {
                            return {
                                ...srvItem,
                                status: (local.status === 'Hoàn thành' || local.status === 'Đang render') ? local.status : srvItem.status,
                                output_file: local.output_file || srvItem.output_file,
                                output_folder: local.output_folder || srvItem.output_folder,
                                has_lyrics: local.has_lyrics !== undefined ? local.has_lyrics : srvItem.has_lyrics,
                                is_locked: local.is_locked || srvItem.is_locked
                            };
                        }
                        return srvItem;
                    });

                    await fetchPredictions();
                    renderQueueTable();
                    updateQueueSummary();

                    if (document.getElementById('setupSection')?.classList.contains('collapsed')) {
                        const imageFolder = document.getElementById('imageFolderPath')?.value.trim() || '';
                        const videoFolder = document.getElementById('videoFolderPath')?.value.trim() || '';
                        const shortImg = formatShortPath(imageFolder);
                        const shortVid = formatShortPath(videoFolder);
                        document.getElementById('setupSummaryText').innerHTML = `
                            <span title="${imageFolder}" style="cursor: pointer; display: inline-flex; align-items: center; gap: 5px;">
                                <i class="fa-regular fa-image" style="color: var(--primary);"></i> <strong>${shortImg}</strong>
                            </span>
                            <span style="color: #64748b; margin: 0 4px;">•</span>
                            <span title="${videoFolder}" style="cursor: pointer; display: inline-flex; align-items: center; gap: 5px;">
                                <i class="fa-solid fa-film" style="color: var(--success);"></i> <strong>${shortVid}</strong>
                            </span>
                        `;
                    }

                    // Tiếp tục bám theo video đang chạy nếu có
                    if (data.active_item_id !== null && data.active_item_id !== undefined) {
                        const activeRow = document.getElementById(`row-${data.active_item_id}`);
                        if (activeRow) scrollToActiveRow(activeRow);
                    }
                } else {
                    alert('Lỗi đồng bộ: ' + (data.error || ''));
                }
            } catch (err) {
                console.error("Lỗi làm mới hàng đợi:", err);
            } finally {
                reloadBtn.disabled = false;
                reloadBtn.innerHTML = originalHtml;
                isRefreshing = false;
            }
        }

        // --- POLLING TIẾN ĐỘ THỜI GIAN THỰC & PLATEAUING ---
        function startProgressPolling(activeItemId) {
            if (pollInterval) clearInterval(pollInterval);

            pollInterval = setInterval(async () => {
                if (!isRunning) {
                    clearInterval(pollInterval);
                    return;
                }
                try {
                    const res = await fetch(`/api/render-progress?id=${activeItemId}`);
                    const data = await res.json();
                    if (data.success) {
                        if (data.progress && data.progress[activeItemId]) {
                            const itemState = data.progress[activeItemId];
                            updateItemProgressUI(activeItemId, itemState);
                        }

                        if (data.queue_summary) {
                            if (data.queue_summary.estimated_queue_remaining_s !== undefined) {
                                document.getElementById('summaryEtaText').innerText = formatDuration(data.queue_summary.estimated_queue_remaining_s);
                            }
                            if (data.queue_summary.prefetch_map) {
                                updatePrefetchUI(data.queue_summary.prefetch_map, activeItemId);
                            }
                        }
                    }
                } catch (e) {
                    console.error("Lỗi polling tiến độ:", e);
                }
            }, 500);
        }

        function updatePrefetchUI(prefetchMap, activeItemId) {
            if (!prefetchMap) return;
            for (const [itemIdStr, pfStatus] of Object.entries(prefetchMap)) {
                const iId = parseInt(itemIdStr);
                if (iId === activeItemId) continue;
                const queueItem = rawQueueData.find(x => x.id === iId);
                if (!queueItem || queueItem.status === 'Hoàn thành' || queueItem.status === 'Đang render') continue;

                const badge = document.getElementById(`status-${iId}`);
                if (!badge) continue;

                if (pfStatus === 'ready') {
                    badge.className = 'status-badge status-prefetched';
                    badge.innerHTML = '<i class="fa-solid fa-bolt" style="color: #fbbf24;"></i> Đã nạp trước';
                    badge.title = 'Đã chuẩn bị trước âm thanh và canvas. Khi bắt đầu sẽ lập tức mã hóa!';

                    // Tự động đánh dấu hoàn thành cho 4 bước đầu trong accordion timeline
                    ['audio_extraction', 'speech_transcription', 'lyric_refinement', 'visual_generation'].forEach(sId => {
                        const stepEl = document.getElementById(`step-${iId}-${sId}`);
                        if (stepEl && !stepEl.classList.contains('step-completed')) {
                            stepEl.className = 'stage-step step-completed';
                            const iconEl = stepEl.querySelector('.step-icon');
                            if (iconEl) iconEl.innerHTML = '<i class="fa-solid fa-bolt" style="color: #fbbf24;"></i>';
                            const durEl = document.getElementById(`step-dur-${iId}-${sId}`);
                            if (durEl) durEl.innerText = 'Sẵn sàng';
                        }
                    });
                } else if (pfStatus === 'in_progress') {
                    badge.className = 'status-badge status-prefetching';
                    badge.innerHTML = '<i class="fa-solid fa-spinner fa-spin" style="color: #60a5fa;"></i> Đang nạp nền...';
                    badge.title = 'Đang xử lý âm thanh & lyrics song song dưới nền';
                }
            }
        }

        function updateItemProgressUI(id, state) {
            const badge = document.getElementById(`status-${id}`);
            const progressFill = document.getElementById(`progress-fill-${id}`);
            const progressText = document.getElementById(`progress-text-${id}`);

            if (state.status === 'processing') {
                badge.className = 'status-badge status-running';
                badge.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ${state.current_stage_label}`;

                // Thanh progress ngắt quãng tại trần từng bước (plateauing)
                progressFill.style.width = `${state.percent}%`;

                const elapsedStr = formatSecondsStrict(state.elapsed_s);
                const remainingStr = formatDuration(state.estimated_remaining_s);
                progressText.innerHTML = `Đang chạy: <strong>${state.current_stage_label}</strong> (${state.percent}%) \n• Đã qua: <strong>${elapsedStr}</strong> • Còn lại: <strong>${remainingStr}</strong>`;
            }

            // Cập nhật từng step trong timeline
            if (state.stages) {
                state.stages.forEach(st => {
                    const stepEl = document.getElementById(`step-${id}-${st.id}`);
                    const durEl = document.getElementById(`step-dur-${id}-${st.id}`);
                    if (!stepEl) return;

                    stepEl.className = `stage-step step-${st.status}`;
                    const iconEl = stepEl.querySelector('.step-icon');

                    if (st.status === 'active') {
                        if (iconEl) iconEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
                        if (durEl) durEl.innerText = 'Đang chạy...';
                    } else if (st.status === 'completed') {
                        if (iconEl) iconEl.innerHTML = '<i class="fa-solid fa-check"></i>';
                        if (durEl) durEl.innerText = formatSecondsStrict(st.duration_s);
                    } else if (st.status === 'failed') {
                        if (iconEl) iconEl.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                        if (durEl) durEl.innerText = 'Lỗi';
                    } else {
                        if (iconEl) iconEl.innerHTML = '<i class="fa-regular fa-circle"></i>';
                        if (durEl) durEl.innerText = '-';
                    }
                });
            }
        }

        // --- BATCH RENDER & AUTO-SCROLL / ACCORDION AUTO-OPEN ---
        async function startBatchRender() {
            isRunning = true;
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'inline-flex';

            for (let i = 0; i < rawQueueData.length; i++) {
                if (!isRunning) break;

                const item = rawQueueData[i];
                if (item.status === 'Hoàn thành') continue;

                // Tự động cuộn hàng đang chạy lên đầu khung nhìn, căn chuẩn dưới sticky header
                const rowEl = document.getElementById(`row-${item.id}`);
                if (rowEl) {
                    scrollToActiveRow(rowEl);
                }

                // Tự động mở chi tiết 6 bước của video đang render
                const tl = document.getElementById(`timeline-${item.id}`);
                const chevron = document.getElementById(`chevron-${item.id}`);
                if (tl) {
                    tl.style.display = 'block';
                    if (chevron) chevron.className = 'fa-solid fa-chevron-up';
                }

                const badge = document.getElementById(`status-${item.id}`);
                const progressWrapper = document.getElementById(`progress-wrapper-${item.id}`);
                const progressFill = document.getElementById(`progress-fill-${item.id}`);
                const progressText = document.getElementById(`progress-text-${item.id}`);

                const isPrefetched = badge && badge.classList.contains('status-prefetched');
                badge.className = 'status-badge status-running';
                if (isPrefetched) {
                    badge.innerHTML = '<i class="fa-solid fa-bolt"></i> Nạp nhanh -> Mã hóa FFmpeg...';
                    progressWrapper.style.display = 'block';
                    progressFill.style.width = '70%';
                    progressText.innerText = 'Dữ liệu B1-4 đã chuẩn bị sẵn! Đang vào mã hóa FFmpeg...';
                } else {
                    badge.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Khởi tạo render...';
                    progressWrapper.style.display = 'block';
                    progressFill.style.width = '5%';
                    progressText.innerText = 'Đang chuẩn bị dữ liệu...';
                }

                // Bắt đầu polling tiến độ
                startProgressPolling(item.id);

                try {
                    const res = await fetch('/api/render-single', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: item.id })
                    });
                    const data = await res.json();

                    if (pollInterval) clearInterval(pollInterval);

                    if (data.success) {
                        item.status = 'Hoàn thành';
                        item.is_locked = true;
                        item.has_lyrics = data.has_lyrics;
                        item.output_file = data.output_file;
                        item.output_folder = data.output_folder;

                        progressFill.style.width = '100%';
                        progressText.innerHTML = '<span style="color: #34d399;"><i class="fa-solid fa-circle-check"></i> Render thành công!</span>';
                        badge.className = 'status-badge status-done';
                        badge.innerHTML = '<i class="fa-solid fa-circle-check"></i> Hoàn thành';

                        // Khóa dòng đã hoàn thành: ẩn nút video nguồn và vô hiệu hóa đổi ảnh
                        if (rowEl) {
                            rowEl.classList.add('row-locked');
                        }
                        const vidBtn = document.getElementById(`btn-vid-toggle-${item.id}`);
                        if (vidBtn) vidBtn.style.display = 'none';
                        const imgThumb = document.getElementById(`img-preview-${item.id}`);
                        if (imgThumb) {
                            imgThumb.onclick = null;
                            imgThumb.title = "Đã render - không thể đổi ảnh";
                        }

                        // Đảm bảo đủ 6/6 bước đều hiển thị tích xanh (khắc phục sót bước 6)
                        STAGE_DEFS.forEach(st => {
                            const stepEl = document.getElementById(`step-${item.id}-${st.id}`);
                            if (stepEl) {
                                stepEl.className = 'stage-step step-completed';
                                const iconEl = stepEl.querySelector('.step-icon');
                                if (iconEl) iconEl.innerHTML = '<i class="fa-solid fa-check"></i>';
                                const durEl = document.getElementById(`step-dur-${item.id}-${st.id}`);
                                if (durEl && (durEl.innerText === '-' || durEl.innerText === 'Đang chạy...')) {
                                    durEl.innerText = 'Xong';
                                }
                            }
                        });

                        const videoUrl = data.video_url || `/${data.output_folder || 'outputs'}/${data.output_file}`;
                        const downloadUrl = (data.output_folder === 'outputs-no-lyrics')
                            ? `/download/no-lyrics/${data.output_file}`
                            : `/download/${data.output_file}`;

                        const badgeHtml = data.has_lyrics
                            ? `<span class="badge-lyrics"><i class="fa-solid fa-music"></i> Có lyrics</span>`
                            : `<span class="badge-no-lyrics"><i class="fa-solid fa-volume-xmark"></i> Không lời</span>`;

                        document.getElementById(`result-${item.id}`).innerHTML = `
                            <div style="display: flex; flex-direction: column; gap: 6px;">
                                <div>${badgeHtml}</div>
                                <button class="btn btn-sm" onclick="openMediaModal('video', '${videoUrl}', '${data.output_file}')">
                                    <i class="fa-solid fa-play"></i> Xem video
                                </button>
                                <a href="${downloadUrl}" target="_blank" style="color: #34d399; font-weight: 600; font-size: 11px; text-decoration: none;">
                                    <i class="fa-solid fa-download"></i> Tải xuống
                                </a>
                            </div>
                        `;
                    } else {
                        item.status = 'Lỗi';
                        badge.className = 'status-badge status-error';
                        badge.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> Lỗi (${data.failing_stage || 'hệ thống'})`;
                        progressText.innerHTML = `<span style="color: #f87171;">Lỗi tại bước: ${data.failing_stage || 'không xác định'}</span>`;
                        document.getElementById(`result-${item.id}`).innerHTML = `<span style="color: #f87171;">${data.error}</span>`;

                        if (tl) tl.style.display = 'block';
                    }
                } catch (err) {
                    if (pollInterval) clearInterval(pollInterval);
                    item.status = 'Lỗi';
                    badge.className = 'status-badge status-error';
                    badge.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Lỗi kết nối';
                    progressText.innerHTML = '<span style="color: #f87171;">Mất kết nối với máy chủ</span>';
                }

                // Cập nhật lại thời gian dự đoán hàng đợi sau mỗi video
                await fetchPredictions();
                updateQueueSummary();
            }

            if (pollInterval) clearInterval(pollInterval);
            isRunning = false;
            document.getElementById('startBtn').style.display = 'inline-flex';
            document.getElementById('startBtn').disabled = true;
            document.getElementById('startBtnText').innerText = 'Đã Render Hoàn Tất';
            document.getElementById('stopBtn').style.display = 'none';
        }

        function stopBatchRender() {
            isRunning = false;
            if (pollInterval) clearInterval(pollInterval);
            document.getElementById('startBtn').style.display = 'inline-flex';
            document.getElementById('startBtn').disabled = false;
            document.getElementById('startBtnText').innerText = 'Tiếp Tục Render';
            document.getElementById('stopBtn').style.display = 'none';
        }

        // --- MEDIA MODAL LIGHTBOX CONTROLS ---
        function openMediaModal(type, url, title) {
            const modal = document.getElementById('mediaModal');
            const titleEl = document.getElementById('mediaModalTitle');
            const bodyEl = document.getElementById('mediaModalBody');
            if (!modal || !titleEl || !bodyEl) return;

            titleEl.innerText = title || (type === 'image' ? 'Xem ảnh nguồn' : 'Xem video thành phẩm');
            if (type === 'image') {
                bodyEl.innerHTML = `
                    <div class="modal-preview-stage" id="lightboxPreviewStage" style="width: 85vw; height: 75vh; max-height: 80vh; margin-bottom: 0;">
                        <img id="lightboxImg" src="${url}" alt="Ảnh xem trước">
                        <div id="lightboxZoomBadge" class="modal-zoom-badge">100%</div>
                        <button id="lightboxZoomResetBtn" class="modal-zoom-reset-btn" onclick="ModalZoomController.reset()" title="Khôi phục kích thước (Nhấp đúp)">
                            <i class="fa-solid fa-arrows-rotate"></i>
                        </button>
                    </div>
                `;
                setTimeout(() => {
                    ModalZoomController.init('lightboxPreviewStage', 'lightboxImg', 'lightboxZoomBadge', 'lightboxZoomResetBtn');
                }, 10);
            } else {
                bodyEl.innerHTML = `<video controls autoplay playsinline src="${url}"></video>`;
            }
            modal.classList.add('active');
        }

        function closeMediaModal() {
            ModalZoomController.reset();
            const modal = document.getElementById('mediaModal');
            const bodyEl = document.getElementById('mediaModalBody');
            if (!modal) return;
            if (bodyEl) {
                const vid = bodyEl.querySelector('video');
                if (vid) vid.pause();
                bodyEl.innerHTML = '';
            }
            imagePickerSession = { itemId: null, originalImage: '', candidateImage: '' };
            modal.classList.remove('active');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeMediaModal();
        });
    </script>
</body>

</html>
